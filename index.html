<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sana sci calc - Scientific Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient floating decorative shapes -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="calculator-container">
    <div class="calculator-card" id="calculator">
      <!-- Calculator Header -->
      <header class="calculator-header">
        <div class="brand-group">
          <div class="brand-badge">
            <span class="brand-sparkle">✨</span>
            <h1 class="brand-title">sana sci calc</h1>
          </div>
          <span class="model-tag">PRECISION SCIENTIFIC</span>
        </div>

        <!-- Simulated Solar Panel -->
        <div class="solar-panel" title="Solar power cell sensor">
          <div class="solar-cell"></div>
          <div class="solar-cell"></div>
          <div class="solar-cell"></div>
          <div class="solar-cell"></div>
        </div>
      </header>

      <!-- Calculator Screen / Display Section -->
      <section class="screen-wrapper">
        <!-- Status Bar -->
        <div class="screen-status-bar">
          <div class="status-indicators">
            <span class="status-pill" id="indicator-angle">DEG</span>
            <span class="status-pill" id="indicator-2nd">2nd</span>
            <span class="status-pill" id="indicator-hyp">HYP</span>
            <span class="status-pill" id="indicator-memory">M</span>
          </div>
          <div class="screen-actions">
            <button type="button" class="action-icon-btn" id="btn-sound-toggle" title="Toggle sound click">
              <span id="sound-icon">🔊</span>
            </button>
            <button type="button" class="action-icon-btn" id="btn-copy" title="Copy result to clipboard">
              <span>📋</span>
              <span class="tooltip" id="copy-tooltip">Copied!</span>
            </button>
            <button type="button" class="action-icon-btn" id="btn-toggle-history" title="View calculation history">
              <span>📜</span>
            </button>
          </div>
        </div>

        <!-- Expression History Line -->
        <div class="screen-expression-line" id="screen-expression" title="Previous expression"></div>

        <!-- Current Value / Output Line -->
        <div class="screen-main-display">
          <span class="main-output" id="screen-main">0</span>
        </div>
      </section>

      <!-- Quick Utility / Mode Toolbar -->
      <div class="mode-toolbar">
        <button type="button" class="mode-btn" id="btn-angle-mode">
          <span class="mode-label">DEG</span>
          <span class="sub-label">RAD</span>
        </button>
        <button type="button" class="mode-btn" id="btn-2nd">
          <span class="mode-label">2nd</span>
        </button>
        <button type="button" class="mode-btn" id="btn-hyp">
          <span class="mode-label">hyp</span>
        </button>
        <button type="button" class="mem-btn" data-action="mc">MC</button>
        <button type="button" class="mem-btn" data-action="mr">MR</button>
        <button type="button" class="mem-btn" data-action="m-plus">M+</button>
        <button type="button" class="mem-btn" data-action="m-minus">M−</button>
      </div>

      <!-- Main Scientific Keypad -->
      <div class="keypad-grid">
        <!-- Row 1: Trig and logs -->
        <button type="button" class="btn btn-sci" data-action="func" data-func="sin" data-inv="asin" data-hyp="sinh" data-invhyp="asinh">
          <span class="primary-text">sin</span>
          <span class="shift-hint">sin⁻¹</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="func" data-func="cos" data-inv="acos" data-hyp="cosh" data-invhyp="acosh">
          <span class="primary-text">cos</span>
          <span class="shift-hint">cos⁻¹</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="func" data-func="tan" data-inv="atan" data-hyp="tanh" data-invhyp="atanh">
          <span class="primary-text">tan</span>
          <span class="shift-hint">tan⁻¹</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="func" data-func="ln" data-inv="exp_e">
          <span class="primary-text">ln</span>
          <span class="shift-hint">eˣ</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="func" data-func="log" data-inv="exp_10">
          <span class="primary-text">log</span>
          <span class="shift-hint">10ˣ</span>
        </button>

        <!-- Row 2: Powers, Roots, Factorial -->
        <button type="button" class="btn btn-sci" data-action="func" data-func="square" data-inv="cube">
          <span class="primary-text">x²</span>
          <span class="shift-hint">x³</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="op" data-val="^" data-inv="yroot">
          <span class="primary-text">xʸ</span>
          <span class="shift-hint">ʸ√x</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="func" data-func="sqrt" data-inv="cbrt">
          <span class="primary-text">√x</span>
          <span class="shift-hint">∛x</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="func" data-func="reciprocal">
          <span class="primary-text">1/x</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="func" data-func="factorial">
          <span class="primary-text">n!</span>
        </button>

        <!-- Row 3: Constants & Parentheses & Percent -->
        <button type="button" class="btn btn-sci" data-action="const" data-val="π">
          <span class="primary-text">π</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="const" data-val="e">
          <span class="primary-text">e</span>
        </button>
        <button type="button" class="btn btn-sci" data-action="bracket" data-val="(">(</button>
        <button type="button" class="btn btn-sci" data-action="bracket" data-val=")">)</button>
        <button type="button" class="btn btn-sci" data-action="func" data-func="percent">
          <span class="primary-text">%</span>
        </button>

        <!-- Row 4: Digits 7,8,9 and Clear / Delete -->
        <button type="button" class="btn btn-num" data-action="num" data-val="7">7</button>
        <button type="button" class="btn btn-num" data-action="num" data-val="8">8</button>
        <button type="button" class="btn btn-num" data-action="num" data-val="9">9</button>
        <button type="button" class="btn btn-danger" data-action="delete" title="Backspace">
          <span>DEL</span>
        </button>
        <button type="button" class="btn btn-danger-accent" data-action="clear" title="All Clear">
          <span>AC</span>
        </button>

        <!-- Row 5: Digits 4,5,6 and Multiply / Divide -->
        <button type="button" class="btn btn-num" data-action="num" data-val="4">4</button>
        <button type="button" class="btn btn-num" data-action="num" data-val="5">5</button>
        <button type="button" class="btn btn-num" data-action="num" data-val="6">6</button>
        <button type="button" class="btn btn-op" data-action="op" data-val="×">×</button>
        <button type="button" class="btn btn-op" data-action="op" data-val="÷">÷</button>

        <!-- Row 6: Digits 1,2,3 and Add / Subtract -->
        <button type="button" class="btn btn-num" data-action="num" data-val="1">1</button>
        <button type="button" class="btn btn-num" data-action="num" data-val="2">2</button>
        <button type="button" class="btn btn-num" data-action="num" data-val="3">3</button>
        <button type="button" class="btn btn-op" data-action="op" data-val="+">+</button>
        <button type="button" class="btn btn-op" data-action="op" data-val="−">−</button>

        <!-- Row 7: 0, Decimal, Sign, Ans, Equals -->
        <button type="button" class="btn btn-num" data-action="num" data-val="0">0</button>
        <button type="button" class="btn btn-num" data-action="dot">.</button>
        <button type="button" class="btn btn-sci" data-action="negate" title="Change sign">±</button>
        <button type="button" class="btn btn-sci" data-action="ans" title="Last answer">Ans</button>
        <button type="button" class="btn btn-equals" data-action="equals" title="Calculate">=</button>
      </div>

      <!-- History Panel (Slides up or expands smoothly) -->
      <aside class="history-drawer" id="history-drawer" aria-hidden="true">
        <div class="history-header">
          <div class="history-title-wrap">
            <span class="history-icon">📜</span>
            <h3>Calculation History</h3>
          </div>
          <div class="history-actions">
            <button type="button" class="history-clear-btn" id="btn-clear-history" title="Clear all history">Clear</button>
            <button type="button" class="history-close-btn" id="btn-close-history" aria-label="Close history">✕</button>
          </div>
        </div>
        <div class="history-list" id="history-list">
          <div class="history-empty">No calculations yet.<br><small>Your calculations will be saved here.</small></div>
        </div>
      </aside>
    </div>

    <!-- Quick Keyboard Guide Footer -->
    <footer class="calculator-footer-guide">
      <div class="guide-chips">
        <span class="chip"><kbd>0</kbd>-<kbd>9</kbd> Numbers</span>
        <span class="chip"><kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> <kbd>^</kbd> Operators</span>
        <span class="chip"><kbd>Enter</kbd> Calculate</span>
        <span class="chip"><kbd>Backspace</kbd> Delete</span>
        <span class="chip"><kbd>Esc</kbd> Clear</span>
        <span class="chip"><kbd>s</kbd> <kbd>c</kbd> <kbd>t</kbd> Trig</span>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
